<div [formGroup]="form">
  <div class="scale" [class.impact-scale]="question.key === 'q4'">
    <div class="scale-options">
      @for (option of question.options; track option.id) {
        <label [for]="option.id">
          <input
            type="radio"
            [id]="option.id"
            [value]="option.value"
            [formControlName]="question.key"
            [attr.aria-label]="option.text"
            [attr.aria-describedby]="question.key + '-error'"
          />
          <span>{{ question.key === 'q4' ? getImpactEmoji(option.value) : option.text }}</span>
        </label>
      }
    </div>

    @if (question.key === 'q4') {
      <div class="intensity-wrap">
        <div class="intensity-labels">
          <span>Baixo impacto</span>
          <span>Alto impacto</span>
        </div>
        <div class="intensity-bar" aria-hidden="true">
          @if (getScaleProgress(question.key) !== null) {
            <span class="intensity-marker" [style.left.%]="getScaleProgress(question.key)"></span>
          }
        </div>
      </div>
    }
  </div>
</div>
